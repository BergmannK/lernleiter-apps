:root{
  --blau:#1E5BD8; --rot:#E02020; --gruen:#2E7D32; --ink:#222; --grau:#E6E6E6; --hgrau:#F4F4F4;
  --gelb:#FFD54A; --papier:#FFFDF7; --karte:#FFF6D5; --ms:#1E5BD8;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Schul",Arial,sans-serif;color:var(--ink);background:var(--papier);font-size:22px;line-height:1.35;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.blau{color:var(--blau)} .rot{color:var(--rot)} .gruen{color:var(--gruen)}
b,strong{font-weight:700}

/* Kopf */
.kopf{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--ms);position:sticky;top:0;z-index:5}
.kopf .nr{min-width:64px;height:48px;border-radius:12px;background:var(--ms);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:22px;padding:0 10px}
.kopf h1{font-size:26px;margin:0;flex:1;line-height:1.1}
.kopf h1 small{display:block;font-size:15px;font-weight:400;color:#666}
.rund{width:52px;height:52px;border-radius:50%;border:2px solid #bbb;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.rund svg{width:30px;height:30px}
.rund.an{background:#E8F0FF;border-color:var(--blau)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 240px}

/* Startseite einer App */
.start{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-top:10px}
.schritte{background:#fff;border:2px solid var(--grau);border-radius:var(--r);padding:14px 20px;text-align:left;max-width:760px;width:100%}
.schritte ol{margin:6px 0 0;padding-left:30px} .schritte li{margin:6px 0}
.modi{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.modus{width:300px;min-height:200px;border-radius:24px;border:3px solid var(--ms);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:700;padding:16px}
.modus:active{transform:scale(.97)}
.modus svg{height:96px}

/* Robo + Sprechblase */
.robozeile{display:flex;align-items:flex-start;gap:12px;margin:6px 0 14px}
.robozeile .figur{width:84px;flex:none}
.blase{position:relative;background:#fff;border:2px solid #9aa;border-radius:18px;padding:12px 16px;flex:1;min-height:60px;display:flex;align-items:center;gap:12px}
.blase:before{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:#9aa;border-left:0}
.blase .txt{flex:1}
.blase .rund{width:46px;height:46px}

/* Wer ist dran */
.dran{display:inline-flex;align-items:center;gap:10px;padding:6px 16px;border-radius:30px;background:#fff;border:2px solid var(--grau);font-weight:700}
.dran .zeichen{font-size:28px;line-height:1}

/* Knöpfe */
.btn{border:none;border-radius:16px;padding:14px 26px;font-weight:700;font-size:24px;background:var(--ms);color:#fff;min-height:60px}
.btn.hell{background:#fff;color:var(--ink);border:2px solid #bbb}
.btn.ok{background:var(--gruen)} .btn.nein{background:#fff;border:3px solid var(--rot);color:var(--rot)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.knopfreihe{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}

/* Overlay (Sprich so, Hilfe, Ende) */
.overlay{position:fixed;inset:0;background:rgba(30,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dialog{background:#fff;border-radius:24px;max-width:720px;width:100%;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:94vh;overflow:auto}
.dialog h2{margin:0 0 10px;font-size:26px;display:flex;align-items:center;gap:10px}
.sprich{background:#EAF6EA;border:3px solid var(--gruen);border-radius:20px;padding:16px 20px;font-size:28px;display:flex;align-items:center;gap:14px}
.sprich .txt{flex:1}
.sprich-titel{color:var(--gruen);font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.overlay.unten{align-items:flex-end;background:rgba(30,30,40,.12)}
.overlay.unten .dialog{margin-bottom:8px}
.hinweis{background:#FFF7DD;border:3px solid #E7B400;border-radius:20px;padding:14px 18px}

/* Torten */
.torten{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.torte{background:#fff;border:3px solid var(--grau);border-radius:18px;padding:10px;width:140px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px}
.torte.wahl{border-color:var(--gruen);background:#EAF6EA}
.torte svg{width:96px;height:96px}

/* Zahlentastatur */
.tasten{display:grid;grid-template-columns:repeat(5,72px);gap:10px;justify-content:center;margin:12px 0}
.tasten button{height:64px;border-radius:14px;border:2px solid #bbb;background:#fff;font-size:30px;font-weight:700}
.tasten button.weg{font-size:22px}
.feld{display:inline-block;min-width:110px;height:64px;border:3px solid var(--ink);border-radius:12px;background:#fff;text-align:center;font-size:36px;font-weight:700;line-height:58px;padding:0 8px;vertical-align:middle}
.feld.aktiv{border-color:var(--blau);box-shadow:0 0 0 4px #CFE0FF}
.feld.richtig{border-color:var(--gruen);color:var(--gruen)}
.feld.falsch{border-color:var(--rot);animation:wackel .4s}
@keyframes wackel{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.versteckt{display:none!important}
@media (max-width:700px){body{font-size:19px}.modus{width:100%}.kopf h1{font-size:21px}}

    <line x1="26" y1="80" x2="12" y2="92" stroke="#3A6E8C" stroke-width="5" stroke-linecap="round"/><line x1="74" y1="80" x2="88" y2="92" stroke="#3A6E8C" stroke-width="5" stroke-linecap="round"/></svg>`;

  /* Torte zur Selbsteinschätzung */
  function torteSVG(viertel) {

  /* Zahlentastatur */

  }
  /* Eingabe in mehrere Felder: felder = [{el, soll}] -> Promise, löst wenn alle richtig */
  function eingabe(parent, felder, { maxLen = 4, beiFehler } = {}) {
    let idx = 0, fehler = 0;
    const setAktiv = i => { idx = i; felder.forEach((f, j) => f.el.classList.toggle('aktiv', j === i)); };
    felder.forEach((f, j) => { f.el.textContent = ''; f.el.onclick = () => setAktiv(j); });
    setAktiv(0);
    return new Promise(res => {
      const tk = tastatur(async k => {
        const f = felder[idx];
        if (k === 'weg') { f.el.textContent = f.el.textContent.slice(0, -1); f.el.classList.remove('falsch', 'richtig'); return; }
        if (k !== 'ok') { if (f.el.textContent.length < maxLen) f.el.textContent += k; f.el.classList.remove('falsch'); return; }
        if (f.el.textContent === '') return;
        if (+f.el.textContent === f.soll) {
          f.el.classList.add('richtig'); f.el.classList.remove('aktiv'); f.el.onclick = null;

        } else {
          f.el.classList.add('falsch'); fehler++;

      });
      parent.append(tk);
    });
  }

  /* Wer ist dran (zu zweit) */
  function dranAnzeige(parent) {
    const el = h('div', { class: 'dran' }); parent.append(el);

  }

})();
</script><script>/* ZR 100 · Karte 5.2 · Zehner-Freunde (Memory) */
(() => {
  const { h, rnd, shuffle, wait } = LL;
  const PAARE = 6;

  const css = `
  .spielfeld{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:760px;margin:0 auto}

  .mk.weg{visibility:hidden}
  .mk.robo-wahl{box-shadow:0 0 0 6px #9FD3F0}

  .zf{display:grid;grid-template-columns:repeat(5,44px);gap:6px;padding:10px;border:3px solid #333;border-radius:10px;background:#fff;width:max-content;margin:10px auto}
  .zf div{width:44px;height:44px;border:2px dashed #aaa;border-radius:50%}

  `;
  document.head.append(h('style', {}, css));

  function neuesSpiel() {
    const einer = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, PAARE);
    const karten = [];
    einer.forEach(e => {
      const z = 1 + rnd(8);

      karten.push({ wert: 10 - e, farbe: 'r', e: 10 - e });
    });

  }
  const passt = (a, b) => a.farbe !== b.farbe && a.e + b.e === 10;
  const blauRot = (a, b) => a.farbe === 'b' ? [a, b] : [b, a];
  const zehnerZiel = blau => Math.ceil(blau.wert / 10) * 10;

  function schablone(blau, rot) {
    const zellen = [];
    for (let i = 0; i < 10; i++) zellen.push(h('div', { class: i < blau.e ? 'b' : i < blau.e + Math.min(rot.wert, 10 - blau.e) ? 'r' : '' }));
    const ueber = blau.e + rot.wert - 10;
    const extra = ueber > 0 ? h('div', { style: 'display:flex;gap:6px;justify-content:center;align-items:center;margin-top:4px' },
      h('span', { style: 'font-size:18px;margin-right:6px' }, 'passt nicht mehr hinein:'),
      Array.from({ length: ueber }, () => h('div', { style: 'width:36px;height:36px;border-radius:50%;background:#E02020' }))) : null;
    return h('div', {},
      h('div', { class: 'zf' }, zellen), extra,
      h('p', { style: 'text-align:center', html: `<span class="blau">${blau.wert}</span> hat <b class="blau">${blau.e}</b> Einer. Dazu kommen <b class="rot">${rot.wert}</b>.` +
        (ueber > 0 ? `<br>Das ist ${ueber} zu viel.` : ueber < 0 ? `<br>Es fehlt noch ${-ueber}.` : '<br>Der Zehner ist voll!') }));
  }
  const satzJa = (b, r) => [`<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind Zehner-Freunde.`, `Zusammen sind sie ${zehnerZiel(b)}.`];
  const satzNein = (b, r) => { const d = b.e + r.wert - 10;
    return [`<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind keine Zehner-Freunde.`, d < 0 ? `Es fehlt noch ${-d}.` : `Das ist ${d} zu viel.`]; };

  function start(mode, main) {

    let gefunden = 0, amZug = mode === 'robo' ? 'du' : 'k1', sperre = false, wahl = [];

    const rz = LL.roboZeile(main);
    const leiste = h('div', { class: 'leiste' });
    const dran = LL.dranAnzeige(leiste);
    const paare = h('div', { class: 'paare' }, h('b', {}, 'Unsere Paare: '));

    const knoepfe = h('div', { class: 'knopfreihe versteckt' }); main.append(knoepfe);

      const b = h('button', { class: `mk zu ${k.farbe}`, 'aria-label': k.farbe === 'b' ? 'blaue Karte' : 'rote Karte' });

    const meldung = t => { if (mode === 'robo') rz.sag(t); else dran.set(amZug, t); };

    function zug() {

      if (gefunden === PAARE) return fertig();
      if (amZug === 'robo') { dran.set('robo'); return roboZug(); }
      dran.set(amZug);
      meldung(mode === 'robo' ? 'Du bist dran. Du deckst eine <span class="blau">blaue</span> und eine <span class="rot">rote</span> Karte auf.' : 'ist dran. Deck eine blaue und eine rote Karte auf.');
    }
    function naechster() { amZug = mode === 'robo' ? (amZug === 'du' ? 'robo' : 'du') : (amZug === 'k1' ? 'k2' : 'k1'); zug(); }

    function tippe(k) {
      if (sperre || amZug === 'robo' || k.offen || k.weg) return;
      if (wahl.length === 1 && wahl[0].farbe === k.farbe) {
        meldung(k.farbe === 'b' ? 'Nimm jetzt eine <span class="rot">rote</span> Karte.' : 'Nimm jetzt eine <span class="blau">blaue</span> Karte.'); return;
      }
      k.offen = true; k.gesehen = true; zeichne(k); wahl.push(k);

    async function entscheiden() {

      let fehler = 0;
      for (;;) {

      }

      await paarAbschluss(b, r, richtig);

    async function paarAbschluss(b, r, richtig) {

    function zeigeSchablone() {

      else LL.hinweis('Deck zuerst eine blaue und eine rote Karte auf. Dann zeigt dir die Schablone, ob der Zehner voll ist.', null, 'Schließen');
    }

    async function roboZug() {

      const da = karten.filter(k => !k.weg);
      const bl = da.filter(k => k.farbe === 'b'), ro = da.filter(k => k.farbe === 'r');

      const bekanntesPaar = bl.filter(x => x.gesehen).map(x => [x, ro.find(y => y.gesehen && passt(x, y))]).find(p => p[1]);
      if (bekanntesPaar && Math.random() < 0.7) [b, r] = bekanntesPaar;
      else { b = bl[rnd(bl.length)]; r = ro[rnd(ro.length)]; }
      for (const k of [b, r]) { k.offen = k.gesehen = true; zeichne(k); k.el.classList.add('robo-wahl'); await wait(700); }
      const richtig = passt(b, r);
      const schummelt = !richtig && Math.random() < 0.45;   // Robo irrt sich manchmal
      const behauptung = richtig || schummelt;
      rz.sag(behauptung ? `<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind Zehner-Freunde!` : `<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind keine Zehner-Freunde.`);
      await wait(600);
      let fehler = 0;
      for (;;) {
        const stimmt = await LL.frage(`Robo sagt: ${behauptung ? `<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind Zehner-Freunde.` : `<span class="blau">${b.wert}</span> und <span class="rot">${r.wert}</span> sind keine Zehner-Freunde.`}<br><b>Stimmt das?</b>`,
          [{ text: 'Stimmt', cls: 'ok', wert: true }, { text: 'Stimmt nicht', cls: 'nein', wert: false }]);

      b.el.classList.remove('robo-wahl'); r.el.classList.remove('robo-wahl');
      if (schummelt) { rz.sag('Oh, danke! Du hast meinen Fehler gefunden.'); await LL.sprichSo(satzNein(b, r)); }
      else { rz.sag(richtig ? 'Danke fürs Prüfen!' : 'Danke fürs Prüfen! Ich decke die Karten wieder zu.'); await LL.sprichSo(richtig ? satzJa(b, r) : satzNein(b, r)); }
      await paarAbschluss(b, r, richtig);
    }

    async function fertig() {
      await wait(500);
      LL.ende(mode === 'robo' ? `Super! Wir haben alle ${PAARE} Paare zusammen gefunden.` : `Super! Ihr habt alle ${PAARE} Paare gefunden.`);
    }
    zug();
  }

  LL.init({
    code: '5.2', title: 'Zehner-Freunde', lernleiter: 'Lernleiter Zahlen und Rechnen bis 100 · Milestone 5 · Spiel', farbe: '#E2557F',
    intro: ['Du deckst eine <span class="blau">blaue</span> und eine <span class="rot">rote</span> Karte auf.',
      'Machen die Zahlen den Zehner voll? Dann sind sie Zehner-Freunde.', 'Die Schablone hilft beim Prüfen.', 'Robo spielt mit. Manchmal irrt sich Robo. Du prüfst genau.'],
    start,
  });
})();
